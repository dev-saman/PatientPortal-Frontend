name: Deploy Staging to Cloudways

on:
  push:
    branches:
      - staging

concurrency:
  group: staging-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Get PNPM Store
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache PNPM Store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CLOUDWAYS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p ${{ secrets.CLOUDWAYS_PORT }} ${{ secrets.CLOUDWAYS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Build to Cloudways
        env:
          REMOTE_USER: ${{ secrets.CLOUDWAYS_USER }}
          REMOTE_HOST: ${{ secrets.CLOUDWAYS_HOST }}
          REMOTE_PORT: ${{ secrets.CLOUDWAYS_PORT }}
          REMOTE_PATH: /home/master/applications/rxtdnqswpd/public_html

        run: |
          echo "Cleaning previous build..."

          ssh -i ~/.ssh/id_ed25519 \
            -p ${REMOTE_PORT} \
            -o StrictHostKeyChecking=no \
            ${REMOTE_USER}@${REMOTE_HOST} << EOF

          cd ${REMOTE_PATH}

          rm -rf assets
          rm -f index.html
          rm -f favicon.svg
          rm -f manifest.json

          EOF

          echo "Uploading new build..."

          rsync -rz \
            --omit-dir-times \
            --no-perms \
            --no-owner \
            --no-group \
            --exclude=".htaccess" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${REMOTE_PORT}" \
            dist/public/ \
            ${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/

      - name: Deployment Completed
        run: echo "✅ Staging deployed successfully to Cloudways"
