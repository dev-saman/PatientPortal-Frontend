name: Deploy Staging to Cloudways

on:
  push:
    branches:
      - staging

concurrency:
  group: staging-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Project
        run: pnpm run build

      - name: Verify Build
        run: |
          echo "Checking build output..."
          ls -la dist
          ls -la dist/public

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CLOUDWAYS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.CLOUDWAYS_PORT }} -H ${{ secrets.CLOUDWAYS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Build to Cloudways
        env:
          REMOTE_USER: ${{ secrets.CLOUDWAYS_USER }}
          REMOTE_HOST: ${{ secrets.CLOUDWAYS_HOST }}
          REMOTE_PORT: ${{ secrets.CLOUDWAYS_PORT }}
          REMOTE_PATH: /home/master/applications/rxtdnqswpd/public_html
        run: |
          rsync -az --delete \
            --exclude=".htaccess" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${REMOTE_PORT}" \
            dist/public/ \
            ${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/

      - name: Deployment Completed
        run: echo "✅ Staging deployed successfully to Cloudways"
